name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit tests
        run: npm test
      - name: convex tests
        run: npx vitest run
      - name: typecheck (convex)
        run: npx tsc --noEmit -p convex
      - name: typecheck (app)
        # LayoutProps/PageProps are generated by Next; a fresh checkout has none until typegen runs.
        run: npx next typegen && npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
        env:
          # The build only needs a URL-shaped value; no Convex call happens at build time.
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
